# This workflow is triggered by Jarl once a new release is published on PyPI.
# It does two things:
# 1. update the `jarl-linter` pin in `.pre-commit-hooks.yaml`. This is the
#    default version of Jarl installed from PyPI with the hook.
# 2. make a new tag corresponding to this version.
#
# Example:
#   - Jarl has releases 0.5.0, 0.6.0, 0.7.0
#   - jarl-pre-commit has the same releases
#   - the user passes "rev: 0.6.0"
#
# In this case, pre-commit clones the tag 0.6.0 and runs
# `pip install . jarl-linter==0.6.0`, unless the user overrides
# `additional_dependencies`.

name: Update jarl version

on:
  repository_dispatch:
    types: [jarl-release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Update version in .pre-commit-hooks.yaml
        env:
          NEW_VERSION: ${{ github.event.client_payload.version }}
        run: |
          sed -i "s/jarl-linter==[^\"]*/jarl-linter==${NEW_VERSION}/" .pre-commit-hooks.yaml
          echo "Updated to jarl ${NEW_VERSION}"
          grep 'jarl-linter' .pre-commit-hooks.yaml

      - name: Commit, tag, and push
        env:
          NEW_VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .pre-commit-hooks.yaml
          git commit -m "Update jarl to ${NEW_VERSION}"
          git tag "${NEW_VERSION}"
          git push origin main --tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ github.event.client_payload.version }}
        run: |
          gh release create "${NEW_VERSION}" \
            --title "jarl ${NEW_VERSION}" \
            --notes "Update jarl to [${NEW_VERSION}](https://github.com/etiennebacher/jarl/releases/tag/${NEW_VERSION})"
