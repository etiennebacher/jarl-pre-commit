# Check that the hook installs and runs on every supported platform.

name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
        tool: [pre-commit, prek]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      # A hook that matches no file is "Skipped" with exit code 0, so also
      # check that it actually ran.
      - name: Run hook
        run: |
          echo 'x <- 1' > test.R
          uvx ${{ matrix.tool }} try-repo . jarl-check --files test.R | tee output.txt
          grep -q Passed output.txt
